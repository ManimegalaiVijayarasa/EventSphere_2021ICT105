version: '3.8'

services:
  web:
    build: .
    container_name: eventsphere-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./eventsphere.db
      - SECRET_KEY=eventsphere-super-secure-session-key-2026
    volumes:
      - ./eventsphere.db:/app/eventsphere.db
    restart: unless-stopped
