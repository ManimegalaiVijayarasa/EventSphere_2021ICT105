{% extends "base.html" %}

{% block title %}Register - EventSphere{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow rounded-4 p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold">Create an Account</h3>
                    <p class="text-muted small">Join EventSphere to book tickets and hire venues</p>
                </div>

                {% if error %}
                <div class="alert alert-danger rounded-3 small">
                    <i class="bi bi-exclamation-circle-fill me-1"></i> {{ error }}
                </div>
                {% endif %}

                <form action="/register" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. John Doe" value="{{ full_name or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@university.edu" value="{{ email or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" minlength="6" placeholder="At least 6 characters" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mb-3">
                        Register Account
                    </button>
                </form>

                <div class="text-center mt-3 text-muted small">
                    Already have an account? <a href="/login" class="fw-semibold text-primary">Sign in</a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
